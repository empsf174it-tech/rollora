<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Rollora Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="auth-logo"><i class="ph-fill ph-waves"></i> Rollora</a>

      <!-- Login -->
      <div id="login-view">
        <div class="auth-head">
          <h1>Welcome <em>back</em></h1>
          <p>Access your saved routines, orders and recovery picks.</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="auth-label" for="login-email">Email</label>
            <input type="email" id="login-email" class="form-control" required autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label class="auth-label" for="login-password">Password</label>
            <div class="password-field">
              <input type="password" id="login-password" class="form-control" required minlength="8" autocomplete="current-password" placeholder="Min 8 characters">
              <button type="button" class="password-toggle" aria-label="Show password"><i class="ph ph-eye"></i></button>
            </div>
          </div>
          <div class="auth-row">
            <label class="checkbox-label"><input type="checkbox" id="login-remember"> Remember me</label>
            <a href="#" class="auth-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary auth-submit">Login</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button type="button" class="btn auth-social"><svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Continue with Google</button>
        <button type="button" class="btn auth-social"><i class="ph-fill ph-apple-logo"></i> Continue with Apple</button>

        <p class="auth-switch">Don't have an account? <a href="#" id="link-to-register" class="auth-link">Register</a></p>
      </div>

      <!-- Register -->
      <div id="register-view" hidden>
        <div class="auth-head">
          <h1>Create <em>account</em></h1>
          <p>Save routines, track orders and get 10% off your first roller.</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="auth-label" for="reg-name">Full name</label>
            <input type="text" id="reg-name" class="form-control" required autocomplete="name" placeholder="Your name">
          </div>
          <div class="form-group">
            <label class="auth-label" for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-control" required autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label class="auth-label" for="reg-password">Password</label>
            <div class="password-field">
              <input type="password" id="reg-password" class="form-control" required minlength="8" autocomplete="new-password" placeholder="Min 8 characters">
              <button type="button" class="password-toggle" aria-label="Show password"><i class="ph ph-eye"></i></button>
            </div>
          </div>
          <div class="form-group">
            <label class="auth-label" for="reg-confirm">Confirm password</label>
            <div class="password-field">
              <input type="password" id="reg-confirm" class="form-control" required minlength="8" autocomplete="new-password" placeholder="Repeat password">
              <button type="button" class="password-toggle" aria-label="Show password"><i class="ph ph-eye"></i></button>
            </div>
            <div id="reg-error" class="form-error"></div>
          </div>
          <div class="auth-row">
            <label class="checkbox-label"><input type="checkbox" id="reg-terms" required> <span>I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a>.</span></label>
          </div>
          <button type="submit" class="btn btn-primary auth-submit">Register</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button type="button" class="btn auth-social"><svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Sign up with Google</button>
        <button type="button" class="btn auth-social"><i class="ph-fill ph-apple-logo"></i> Sign up with Apple</button>

        <p class="auth-switch">Already have an account? <a href="#" id="link-to-login" class="auth-link">Login</a></p>
      </div>

      <p class="auth-secure"><i class="ph ph-lock-simple"></i> Secure connection (demo)</p>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
